<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head('Inteligencia de Negocios')}"></head>

<body class="admin-layout">

    <!-- Topbar -->
    <header th:replace="~{admin/fragments/topbar :: topbar('Inteligencia de Negocios')}"></header>

    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

    <!-- Contenido Principal -->
    <main class="admin-main">
        <div class="admin-content">

            <div th:replace="~{admin/fragments/alerts :: alerts}"></div>

            <!-- ==================== SECCIÓN POWER BI ==================== -->
            <div id="powerbi-page" class="admin-page section">
                <div class="page-card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; min-height: calc(100vh - 130px);">
                    <div class="adm-section-head" style="padding: 20px 24px; margin-bottom: 0; border-bottom: 1px solid var(--adm-line);">
                        <div class="adm-section-head__info">
                            <h3 class="adm-section-head__title">
                                <i class="fas fa-chart-pie" aria-hidden="true"></i>
                                <span>Inteligencia de Negocios (Power BI)</span>
                            </h3>
                            <p class="adm-section-head__sub">Tablero interactivo de métricas comerciales, desempeño regional y volumen de ventas.</p>
                        </div>
                        <a href="https://app.powerbi.com/view?r=eyJrIjoiZTQ5ZWNlNGUtMWVjMi00MmQ3LTkyNTMtN2Q4NzUyNDI4ZDIzIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="btn-action btn-action--outline">
                            <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                            <span>Abrir en Power BI</span>
                        </a>
                    </div>

                    <div style="flex: 1; background: var(--adm-green-soft); display: flex; flex-direction: column; min-height: 560px;">
                        <iframe title="Cultivus Power BI"
                                src="https://app.powerbi.com/view?r=eyJrIjoiZTQ5ZWNlNGUtMWVjMi00MmQ3LTkyNTMtN2Q4NzUyNDI4ZDIzIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9"
                                style="width: 100%; height: 100%; border: none; flex: 1; min-height: 560px;"
                                allowFullScreen="true"></iframe>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script th:src="@{/js/admin-panel.js}"></script>
</body>

</html>
