<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head('Gestionar Usuarios')}"></head>

<body class="admin-layout">

    <header th:replace="~{admin/fragments/topbar :: topbar('Gestionar Usuarios')}"></header>
    <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

    <main class="admin-main">
        <div class="admin-content">
            <div th:replace="~{admin/fragments/alerts :: alerts}"></div>

            <div class="admin-page" id="usuarios-page">
                <div class="page-card">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2><i class="fas fa-users"></i> Gestionar Usuarios</h2>
                        <form th:action="@{/admin/usuarios}" method="get" style="display: flex; gap: 10px;">
                            <input type="text" name="search" th:value="${searchQuery}"
                                placeholder="Buscar por nombre o email..."
                                style="padding: 8px 15px; border: 1px solid #d6e2d8; border-radius: 20px; outline: none; min-width: 200px;">
                            <select name="rol"
                                style="padding: 8px 15px; border: 1px solid #d6e2d8; border-radius: 20px; outline: none; background: white;">
                                <option value="">Todos los roles</option>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                    th:selected="${r == rolFilter}"></option>
                            </select>
                            <button type="submit"
                                style="background: var(--adm-green); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer;">
                                <i class="fas fa-search"></i> Filtrar
                            </button>
                            <a th:if="${(searchQuery != null and !searchQuery.isEmpty()) or (rolFilter != null and !rolFilter.isEmpty())}"
                                th:href="@{/admin/usuarios}"
                                style="background: var(--adm-red); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; text-decoration: none;">
                                <i class="fas fa-times"></i> Limpiar
                            </a>
                        </form>
                    </div>

                    <div th:if="${usuarios != null and !usuarios.empty}">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${usuarios.content}">
                                    <td th:text="${user.id}">#001</td>
                                    <td th:text="${user.nombre}">Juan García</td>
                                    <td th:text="${user.email}">juan@cultivus.com</td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${user.rol != null ? (user.rol.name() == 'ADMIN' ? 'badge-admin' : (user.rol.name() == 'VENDEDOR' ? 'badge-mod' : 'badge-user')) : 'badge-user'}"
                                            th:text="${user.rol != null ? user.rol : 'SIN ROL'}">Rol</span>
                                    </td>
                                    <td><span class="badge badge-active">Activo</span></td>
                                    <td>
                                        <form th:action="@{/admin/usuarios/{id}/cambiar-rol(id=${user.id})}"
                                            method="post" style="display:inline;">
                                            <select name="nuevoRol" onchange="this.form.submit()">
                                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                                    th:selected="${user.rol != null && user.rol.name() == r}"></option>
                                            </select>
                                        </form>
                                        <form th:action="@{/admin/usuarios/{id}/eliminar(id=${user.id})}" method="post"
                                            style="display:inline;" onsubmit="return confirm('¿Eliminar usuario?')">
                                            <button type="submit" class="btn-action"
                                                style="background: var(--adm-red); border:none; cursor:pointer;"><i
                                                    class="fas fa-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Paginación Usuarios -->
                        <div th:if="${usuarios.totalPages > 1}" class="paginacion-container"
                            style="display:flex; justify-content:center; align-items:center; gap:15px; margin-top:30px; padding:20px 0;">
                            <a th:href="@{/admin/usuarios(page=${usuarios.number - 1}, search=${searchQuery}, rol=${rolFilter})}"
                                th:if="${usuarios.hasPrevious()}"
                                style="padding:8px 16px; border:1px solid #d6e2d8; border-radius:5px; background:white; cursor:pointer; text-decoration:none; color:#111e15;">
                                <i class="fas fa-chevron-left"></i> Anterior
                            </a>
                            <button th:unless="${usuarios.hasPrevious()}" disabled
                                style="padding:8px 16px; border:1px solid var(--adm-line); border-radius:5px; background:var(--adm-green-soft); color:#94a39a; cursor:not-allowed;">
                                <i class="fas fa-chevron-left"></i> Anterior
                            </button>
                            <div style="display:flex; gap:5px;">
                                <span th:each="i : ${#numbers.sequence(0, usuarios.totalPages - 1)}"
                                    th:if="${i >= usuarios.number - 2 and i <= usuarios.number + 2}">
                                    <a th:href="@{/admin/usuarios(page=${i}, search=${searchQuery}, rol=${rolFilter})}"
                                        th:text="${i + 1}"
                                        th:style="${i == usuarios.number ? 'background:var(--adm-green); color:white; border:1px solid var(--adm-green);' : 'background:white; color:#111e15; border:1px solid #d6e2d8;'}"
                                        style="padding:8px 14px; border-radius:5px; text-decoration:none; font-weight:600; cursor:pointer; transition: 0.3s;">
                                    </a>
                                </span>
                            </div>
                            <a th:href="@{/admin/usuarios(page=${usuarios.number + 1}, search=${searchQuery}, rol=${rolFilter})}"
                                th:if="${usuarios.hasNext()}"
                                style="padding:8px 16px; border:1px solid #d6e2d8; border-radius:5px; background:white; cursor:pointer; text-decoration:none; color:#111e15;">
                                Siguiente <i class="fas fa-chevron-right"></i>
                            </a>
                            <button th:unless="${usuarios.hasNext()}" disabled
                                style="padding:8px 16px; border:1px solid var(--adm-line); border-radius:5px; background:var(--adm-green-soft); color:#94a39a; cursor:not-allowed;">
                                Siguiente <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <div th:if="${usuarios == null or usuarios.empty}"
                        style="text-align:center; padding:40px; color:#7b8b80;">
                        <i class="fas fa-users"
                            style="font-size:48px; color:#d6e2d8; margin-bottom:15px; display:block;"></i>
                        <p style="font-size:18px;">No se encontraron usuarios.</p>
                    </div>

                </div>
            </div>


        </div>
    </main>

    <script th:src="@{/js/admin-panel.js}"></script>
</body>

</html>
