<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head('Moderar Ofertas y Catálogo')}"></head>

<body class="admin-layout">

    <header th:replace="~{admin/fragments/topbar :: topbar('Moderar Ofertas y Catálogo')}"></header>
    <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

    <main class="admin-main">
        <div class="admin-content">
            <div th:replace="~{admin/fragments/alerts :: alerts}"></div>

            <div class="admin-page" id="moderacion-page">
                <div class="page-card">
                    <h2><i class="fas fa-gavel"></i> Moderación de Catálogo</h2>
                    <p style="color:#7b8b80;margin-bottom:16px;">Sugerencias de productos enviadas por vendedores para el
                        catálogo global.</p>

                    <div th:if="${catalogoPendiente == null or catalogoPendiente.empty}"
                        style="text-align:center;padding:40px;color:#7b8b80;">
                        <i class="fas fa-check-circle"
                            style="font-size:40px;color:var(--adm-green);margin-bottom:12px;display:block;"></i>
                        <p>No hay sugerencias pendientes de moderación. ¡Buen trabajo!</p>
                    </div>

                    <div th:if="${catalogoPendiente != null and !catalogoPendiente.empty}">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th>Unidad</th>
                                    <th>Descripción</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${catalogoPendiente.content}">
                                    <td>
                                        <img th:if="${p.imagenUrl}" th:src="${p.imagenUrl}"
                                            style="width:50px; height:50px; object-fit:cover; border-radius:8px;">
                                        <i th:unless="${p.imagenUrl}" class="fas fa-leaf" style="color:var(--adm-green);"></i>
                                    </td>
                                    <td th:text="${p.nombre}">Nombre</td>
                                    <td>
                                        <span class="badge" style="background:var(--adm-green-light); color:var(--adm-green-dark);"
                                            th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">Categoría</span>
                                    </td>
                                    <td th:text="${p.unidadMedida}">kg</td>
                                    <td th:text="${p.descripcion}"
                                        style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                                        Descripción</td>
                                    <td style="white-space:nowrap;">
                                        <form th:action="@{/admin/catalogo/{id}/aprobar(id=${p.id})}" method="post"
                                            style="display:inline;">
                                            <button type="submit" class="btn-action"
                                                style="background:var(--adm-green); color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">
                                                <i class="fas fa-check"></i> Aprobar
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/catalogo/{id}/rechazar(id=${p.id})}" method="post"
                                            style="display:inline; margin-left:6px;">
                                            <button type="submit" class="btn-action"
                                                style="background:var(--adm-red); color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;"
                                                onclick="return confirm('¿Rechazar esta sugerencia?')">
                                                <i class="fas fa-times"></i> Rechazar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Paginación Moderación de Catálogo -->
                        <div th:if="${catalogoPendiente.totalPages > 1}" class="paginacion-container"
                            style="display:flex; justify-content:center; align-items:center; gap:15px; margin-top:30px; padding:20px 0;">
                            <a th:href="@{/admin/moderacion(page=${catalogoPendiente.number - 1})}"
                                th:if="${catalogoPendiente.hasPrevious()}"
                                style="padding:8px 16px; border:1px solid #d6e2d8; border-radius:5px; background:white; cursor:pointer; text-decoration:none; color:#111e15;">
                                <i class="fas fa-chevron-left"></i> Anterior
                            </a>
                            <button th:unless="${catalogoPendiente.hasPrevious()}" disabled
                                style="padding:8px 16px; border:1px solid var(--adm-line); border-radius:5px; background:var(--adm-green-soft); color:#94a39a; cursor:not-allowed;">
                                <i class="fas fa-chevron-left"></i> Anterior
                            </button>
                            <div style="display:flex; gap:5px;">
                                <span th:each="i : ${#numbers.sequence(0, catalogoPendiente.totalPages - 1)}"
                                    th:if="${i >= catalogoPendiente.number - 2 and i <= catalogoPendiente.number + 2}">
                                    <a th:href="@{/admin/moderacion(page=${i})}" th:text="${i + 1}"
                                        th:style="${i == catalogoPendiente.number ? 'background:var(--adm-green); color:white; border:1px solid var(--adm-green);' : 'background:white; color:#111e15; border:1px solid #d6e2d8;'}"
                                        style="padding:8px 14px; border-radius:5px; text-decoration:none; font-weight:600; cursor:pointer; transition: 0.3s;">
                                    </a>
                                </span>
                            </div>
                            <a th:href="@{/admin/moderacion(page=${catalogoPendiente.number + 1})}"
                                th:if="${catalogoPendiente.hasNext()}"
                                style="padding:8px 16px; border:1px solid #d6e2d8; border-radius:5px; background:white; cursor:pointer; text-decoration:none; color:#111e15;">
                                Siguiente <i class="fas fa-chevron-right"></i>
                            </a>
                            <button th:unless="${catalogoPendiente.hasNext()}" disabled
                                style="padding:8px 16px; border:1px solid var(--adm-line); border-radius:5px; background:var(--adm-green-soft); color:#94a39a; cursor:not-allowed;">
                                Siguiente <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script th:src="@{/js/admin-panel.js}"></script>
</body>

</html>
