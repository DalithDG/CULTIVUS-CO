<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Ofertas disponibles de productores locales en Cultivus.">
    <title>Ofertas del Campo | Cultivus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" th:href="@{/checkout-tokens.css}">
    <link rel="stylesheet" th:href="@{/cultivus-ui.css}">
    <link rel="stylesheet" th:href="@{/catalog-apple.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">
    <th:block th:replace="~{fragments/animaciones :: gsap}"></th:block>
    <th:block th:replace="~{fragments/animaciones :: animatedContent}"></th:block>
</head>

<body class="catalog-page">

    <!-- HEADER INSTITUCIONAL -->
    <th:block th:replace="~{fragments/header :: siteHeader}"></th:block>

    <main class="ui-container" id="lista-ofertas">
        <!-- BREADCRUMB & CABECERA -->
        <header class="catalog-header">
            <nav class="ui-breadcrumb" aria-label="Migas de pan">
                <a th:href="@{/}"><i class="fas fa-home"></i> Inicio</a>
                <span class="sep">/</span>
                <span class="current">Ofertas del Campo</span>
            </nav>

            <h1 class="ui-title-1">Ofertas del Campo</h1>
            <p class="ui-subtitle">Lo más fresco de nuestros productores directos a tu mesa con los mejores precios.</p>
        </header>

        <!-- TOOLBAR DE CONTEO -->
        <div class="catalog-toolbar">
            <div class="catalog-toolbar__count">
                <i class="fas fa-tag" style="color: var(--c-green);"></i>
                <span>
                    <strong th:text="${totalItems != null ? totalItems : 0}">0</strong>
                    ofertas activas disponibles
                </span>
            </div>
            <div>
                <a th:href="@{/category}" class="ui-btn ui-btn--secondary ui-btn--sm">
                    <i class="fas fa-border-all"></i> Ver catálogo general
                </a>
            </div>
        </div>

        <!-- GRID DE OFERTAS UNIFICADAS -->
        <div class="product-grid" th:if="${ofertas != null and !ofertas.isEmpty()}" data-anim-content data-anim-stagger="0.06">
            <th:block th:each="o : ${ofertas}">
                <th:block th:replace="~{fragments/oferta-card :: card(${o})}"></th:block>
            </th:block>
        </div>

        <!-- ESTADO VACÍO -->
        <th:block th:if="${#lists.isEmpty(ofertas)}">
            <th:block th:replace="~{fragments/estado-vacio :: sinProductos}"></th:block>
        </th:block>

        <!-- PAGINACIÓN -->
        <div class="ui-pagination" th:if="${totalPages != null and totalPages > 1}">
            <a class="ui-btn ui-btn--secondary ui-btn--sm"
               th:classappend="${page <= 0 ? 'ui-btn--disabled' : ''}"
               th:href="@{/ofertas(page=${page - 1}, size=${size})} + '#lista-ofertas'">
                <i class="fas fa-chevron-left"></i> Anterior
            </a>

            <div style="display: flex; gap: 4px;">
                <a th:each="p : ${#numbers.sequence(startPage, endPage)}"
                   th:href="@{/ofertas(page=${p}, size=${size})} + '#lista-ofertas'"
                   class="ui-btn ui-btn--sm"
                   th:classappend="${p == page ? 'ui-btn--primary' : 'ui-btn--secondary'}"
                   th:text="${p + 1}">1</a>
            </div>

            <a class="ui-btn ui-btn--secondary ui-btn--sm"
               th:classappend="${page + 1 >= totalPages ? 'ui-btn--disabled' : ''}"
               th:href="@{/ofertas(page=${page + 1}, size=${size})} + '#lista-ofertas'">
                Siguiente <i class="fas fa-chevron-right"></i>
            </a>
        </div>
    </main>

    <!-- FOOTER INSTITUCIONAL -->
    <th:block th:replace="~{fragments/footer :: siteFooter}"></th:block>

</body>

</html>
