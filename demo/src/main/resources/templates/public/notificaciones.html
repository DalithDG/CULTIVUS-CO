<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis Notificaciones | Cultivus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" th:href="@{/checkout-tokens.css}">
    <link rel="stylesheet" th:href="@{/cultivus-ui.css}">
    <link rel="stylesheet" th:href="@{/buyer-apple.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">
</head>

<body class="notif-page">

    <!-- HEADER GENERAL -->
    <header th:replace="~{fragments/header :: siteHeader}"></header>

    <main class="ui-container">
        <div class="notif-wrap">

            <!-- CABECERA -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--c-line);">
                <div>
                    <h1 class="ui-title-1" style="margin-bottom: 2px;">
                        <i class="fas fa-bell" style="color: var(--c-green); font-size: 1.8rem; margin-right: 8px;"></i> Notificaciones
                    </h1>
                    <p class="ui-subtitle" style="margin-bottom: 0;">Novedades sobre tus compras, cosechas y envíos.</p>
                </div>
                <a th:href="@{/}" class="ui-btn ui-btn--tertiary ui-btn--sm">
                    <i class="fas fa-home"></i> Inicio
                </a>
            </div>

            <!-- ESTADO VACÍO -->
            <div th:if="${#lists.isEmpty(notificaciones)}" class="ui-empty">
                <div class="ui-empty__icon"><i class="fas fa-bell-slash"></i></div>
                <h3 class="ui-empty__title">Sin notificaciones pendientes</h3>
                <p class="ui-empty__desc">Aquí recibirás actualizaciones sobre el estado de tus pedidos y cosechas de interés.</p>
                <a th:href="@{/category}" class="ui-btn ui-btn--secondary" style="margin-top: 12px;">
                    Explorar cosechas
                </a>
            </div>

            <!-- LISTA BANDEJA DE ENTRADA -->
            <div class="notif-list" th:if="${notificaciones != null and !notificaciones.isEmpty()}">
                <article th:each="n : ${notificaciones}" class="notif-card" th:classappend="${!n.leida ? 'is-unread' : ''}">
                    <!-- Icono tintado según el tipo -->
                    <div class="notif-icon-box"
                         th:classappend="${n.tipo == 'INFO' ? 'notif-icon--info' :
                                          n.tipo == 'SUCCESS' ? 'notif-icon--success' :
                                          n.tipo == 'WARNING' ? 'notif-icon--warning' : 'notif-icon--danger'}">
                        <i th:class="${n.tipo == 'INFO' ? 'fas fa-info-circle' : 
                                     n.tipo == 'SUCCESS' ? 'fas fa-check-circle' : 
                                     n.tipo == 'WARNING' ? 'fas fa-triangle-exclamation' : 'fas fa-circle-exclamation'}"></i>
                    </div>

                    <!-- Contenido -->
                    <div class="notif-body">
                        <div class="notif-title-row">
                            <h3 class="notif-title" th:text="${n.titulo}">Título de la notificación</h3>
                            <span class="notif-time" th:text="${#temporals.format(n.fecha, 'dd MMM, yyyy HH:mm')}">12 May, 2026</span>
                        </div>

                        <p class="notif-message" th:text="${n.mensaje}">
                            Cuerpo del mensaje de la notificación.
                        </p>

                        <div th:if="${!n.leida}">
                            <span class="ui-chip ui-chip--green" style="font-size: 0.7rem; padding: 2px 8px;">
                                <i class="fas fa-circle" style="font-size: 6px;"></i> Nueva
                            </span>
                        </div>
                    </div>
                </article>
            </div>

        </div>
    </main>

    <!-- FOOTER INSTITUCIONAL -->
    <footer th:replace="~{fragments/footer :: siteFooter}"></footer>

</body>

</html>
