<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil de Transportista - Cultivus</title>
    <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
    <link rel="stylesheet" th:href="@{/perfil.css}">
    <link rel="stylesheet" th:href="@{/header.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header th:replace="~{fragments/header-transportista :: siteHeader}"></header>

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
                <div style="display:flex; align-items:center; gap:16px;">
                    <div class="profile-icon" style="margin:0;">
                        <i class="fa-solid fa-truck-fast"></i>
                    </div>
                    <div>
                        <h1 style="margin:0;" th:text="${usuario.nombre}">Transportista</h1>
                        <p class="profile-subtitle" style="margin:4px 0 0;">Perfil de Transportista Logístico · Cultivus</p>
                    </div>
                </div>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <a th:href="@{/transportista/inicio}" class="btn btn-primary" style="text-decoration:none; background:#2e7d32; color:#fff;">
                        <i class="fa-solid fa-route"></i> Mis Rutas y Envíos
                    </a>
                </div>
            </div>

            <div th:if="${mensaje}" class="alert alert-success">
                <i class="fa-solid fa-check-circle"></i>
                <span th:text="${mensaje}"></span>
            </div>
            <div th:if="${error}" class="alert alert-error">
                <i class="fa-solid fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Datos del Transportista y Vehículo -->
            <div class="info-section" th:if="${usuario.perfilTransportista != null}">
                <h2 style="color:#2e7d32;"><i class="fa-solid fa-truck"></i> Datos Logísticos y Vehículo</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Estado de Verificación:</label>
                        <p th:text="${usuario.perfilTransportista.verificado ? 'Transportista Verificado' : 'Pendiente de Verificación'}"
                           th:style="${usuario.perfilTransportista.verificado ? 'color:#2e7d32; font-weight:700;' : 'color:#d97706; font-weight:700;'}">
                            Verificado
                        </p>
                    </div>
                    <div class="info-item">
                        <label>Disponibilidad Actual:</label>
                        <p th:text="${usuario.perfilTransportista.disponible ? 'Disponible para rutas' : 'En ruta / Ocupado'}"
                           th:style="${usuario.perfilTransportista.disponible ? 'color:#2e7d32; font-weight:700;' : 'color:#dc2626; font-weight:700;'}">
                            Disponible
                        </p>
                    </div>
                    <div class="info-item">
                        <label>Tipo de Vehículo:</label>
                        <p th:text="${usuario.perfilTransportista.tipoVehiculo != null ? usuario.perfilTransportista.tipoVehiculo : 'No especificado'}">Camioneta</p>
                    </div>
                    <div class="info-item">
                        <label>Placa:</label>
                        <p th:text="${usuario.perfilTransportista.placa != null ? usuario.perfilTransportista.placa : 'No especificada'}">ABC-123</p>
                    </div>
                    <div class="info-item">
                        <label>Capacidad de Carga:</label>
                        <p th:text="${usuario.perfilTransportista.capacidadCargaKg != null ? (usuario.perfilTransportista.capacidadCargaKg + ' kg') : 'No especificada'}">1000 kg</p>
                    </div>
                    <div class="info-item">
                        <label>Zonas de Cobertura:</label>
                        <p th:text="${usuario.perfilTransportista.zonasCobertura != null ? usuario.perfilTransportista.zonasCobertura : 'Bolívar'}">Zonas</p>
                    </div>
                    <div class="info-item">
                        <label>Teléfono de Contacto:</label>
                        <p th:text="${usuario.perfilTransportista.telefonoContacto != null ? usuario.perfilTransportista.telefonoContacto : '-'}">-</p>
                    </div>
                    <div class="info-item">
                        <label>Ciudad Base:</label>
                        <p th:text="${usuario.perfilTransportista.ciudadBase != null ? (usuario.perfilTransportista.ciudadBase + ', ' + usuario.perfilTransportista.departamentoBase) : '-'}">-</p>
                    </div>
                </div>
            </div>

            <!-- Editar Cuenta Personal -->
            <div class="edit-section" style="margin-top:24px; border-top:1px solid #e5e7eb; padding-top:24px;">
                <h2><i class="fa-solid fa-user-pen"></i> Editar Datos de mi Cuenta</h2>
                <form th:action="@{/usuario/perfil/actualizar}" method="post" class="edit-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombre"><i class="fa-solid fa-user"></i> Nombre Completo</label>
                            <input type="text" id="nombre" name="nombre" th:value="${usuario.nombre}" required placeholder="Ingrese su nombre completo">
                        </div>
                        <div class="form-group">
                            <label for="email"><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
                            <input type="email" id="email" name="email" th:value="${usuario.email}" required placeholder="correo@ejemplo.com">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="departamento"><i class="fa-solid fa-map-marked-alt"></i> Departamento</label>
                            <select id="departamento" name="departamento">
                                <option value="">Seleccione un departamento</option>
                                <option th:each="dept : ${departamentos}" th:value="${dept.nombre}" th:text="${dept.nombre}"
                                    th:selected="${usuario.ubicacion != null and usuario.ubicacion.departamento == dept.nombre}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ciudad"><i class="fa-solid fa-city"></i> Ciudad</label>
                            <input type="text" id="ciudad" name="ciudad"
                                   th:value="${usuario.ubicacion != null ? usuario.ubicacion.ciudad : (usuario.perfilTransportista != null ? usuario.perfilTransportista.ciudadBase : '')}"
                                   placeholder="Ingrese su ciudad">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="contrasena"><i class="fa-solid fa-lock"></i> Nueva Contraseña (opcional)</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Dejar en blanco para mantener la actual">
                        <small>Solo complete este campo si desea cambiar su contraseña</small>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Guardar Cambios</button>
                        <a th:href="@{/transportista/inicio}" class="btn btn-secondary">Volver a Mis Rutas</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
