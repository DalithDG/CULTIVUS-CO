<header th:fragment="siteHeader" class="site-header">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <div class="header-premium" id="mainHeader" style="background: #ffffff; color: #1f2937; border-bottom: 1px solid #e5e7eb;">
        <div class="header-container" style="max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px;">
            
            <!-- Logo con Sello Logístico -->
            <div class="header-logo">
                <a th:href="@{/transportista/inicio}" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1f2937;">
                    <img th:src="@{/images/imagotipo_transparente.png}" alt="Cultivus" style="height: 40px; width: auto;">
                </a>
            </div>

            <!-- Navegación de Transportista -->
            <nav class="header-nav" style="display: flex; align-items: center; gap: 20px;">
                <a th:href="@{/transportista/inicio}" class="nav-link" style="color: #1f2937; text-decoration: none; font-weight: 600; font-size: 0.92rem; display: flex; align-items: center; gap: 6px;">
                    <i class="fas fa-route" style="color: #3d7a1e;"></i>
                    <span>Mis Rutas y Envíos</span>
                </a>


            </nav>

            <!-- Acciones / Perfil -->
            <div class="header-actions" style="display: flex; align-items: center; gap: 16px;">
                
                <!-- Badge de Disponibilidad -->
                <div th:if="${session.usuarioLogueado != null and session.usuarioLogueado.perfilTransportista != null}" 
                     style="display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; font-size: 0.78rem; font-weight: 700;"
                     th:styleappend="${session.usuarioLogueado.perfilTransportista.disponible} ? 'background:#064e3b; color:#6ee7b7; border: 1px solid #3d7a1e;' : 'background:#7f1d1d; color:#fca5a5; border: 1px solid #dc2626;'">
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%;"
                          th:styleappend="${session.usuarioLogueado.perfilTransportista.disponible} ? 'background:#6ab733;' : 'background:#ef4444;'"></span>
                    <span th:text="${session.usuarioLogueado.perfilTransportista.disponible} ? 'DISPONIBLE' : 'EN RUTA'">DISPONIBLE</span>
                </div>

                                <!-- Menú desplegable de perfil -->
                <div class="account-menu" id="accountMenu">
                    <button class="btn-account" id="accountMenuBtn" type="button" aria-haspopup="true"
                        aria-expanded="false" aria-controls="accountMenuPanel" aria-label="Menú de perfil de usuario">
                        <div class="account-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="account-info">
                            <span class="account-greeting">Hola,</span>
                            <span class="account-name"
                                th:text="${session.usuarioLogueado != null ? (session.usuarioLogueado.nombre != null ? session.usuarioLogueado.nombre : 'Usuario') : 'Usuario'}">Usuario</span>
                        </div>
                        <i class="fas fa-chevron-down account-caret" aria-hidden="true"></i>
                    </button>

                    <div class="account-menu__panel" id="accountMenuPanel" role="menu" aria-labelledby="accountMenuBtn">
                        <div class="account-panel__user" th:if="${session.usuarioLogueado != null}">
                            <div class="account-panel__user-icon">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <div class="account-panel__user-meta">
                                <span class="account-panel__user-name"
                                    th:text="${session.usuarioLogueado.nombre}">Usuario</span>
                                <span class="account-panel__user-email" th:if="${session.usuarioLogueado.email != null}"
                                    th:text="${session.usuarioLogueado.email}">email@ejemplo.com</span>
                            </div>
                        </div>

                        <div class="account-panel__divider"></div>

                        <a th:href="@{/usuario/perfil}" class="account-panel__link" role="menuitem">
                            <span class="account-panel__icon-box"><i class="fas fa-user"></i></span>
                            <span class="account-panel__text">Mi perfil</span>
                        </a>

                        <a th:href="@{/transportista/billetera}" class="account-panel__link" role="menuitem">
                            <span class="account-panel__icon-box"><i class="fas fa-wallet"></i></span>
                            <span class="account-panel__text">Billetera</span>
                        </a>

                        <div class="account-panel__divider"></div>

                        <a th:href="@{/usuario/logout}" class="account-panel__link is-danger" role="menuitem">
                            <span class="account-panel__icon-box"><i class="fas fa-sign-out-alt"></i></span>
                            <span class="account-panel__text">Cerrar sesión</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</header>
