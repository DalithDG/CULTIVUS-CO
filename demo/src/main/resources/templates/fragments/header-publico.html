<header th:fragment="siteHeader" class="site-header site-header--publico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/header-tokens.css}">
    <link rel="stylesheet" th:href="@{/header-publico.css}">

    <div class="header-premium header--publico" id="mainHeader">
        <div class="header-container">
            <!-- Logo con Slogan -->
            <div class="header-logo">
                <a th:href="@{/}">
                    <img th:src="@{/images/imagotipo_transparente.png}" alt="Cultivus">
                </a>
            </div>

            <!-- Navegación Principal (Público con Nosotros) -->
            <nav class="header-nav">
                <th:block th:replace="~{fragments/nav-publico :: enlacesPublico}"></th:block>
            </nav>

            <!-- Buscador Amplio Adaptable -->
            <div th:replace="~{fragments/nav-publico :: buscador}"></div>

            <!-- Acciones de Usuario (Vender, Iniciar sesión, Carrito) -->
            <div class="header-actions">
                <!-- Vender en Cultivus en barra de escritorio -->
                <a th:href="@{/vendedor/registro}" class="btn-sell highlight" title="Vender en Cultivus">
                    <i class="fas fa-store"></i>
                    <span>Vender en Cultivus</span>
                </a>

                <!-- Separador sutil para organizar las acciones -->
                <div class="header-actions__divider" aria-hidden="true"></div>

                <!-- Iniciar sesión (botón principal destacado) -->
                <a th:href="@{/usuario/login}" class="btn-login" title="Iniciar sesión">
                    <i class="fas fa-user"></i>
                    <span>Iniciar sesión</span>
                </a>

                <!-- Carrito con Badge -->
                <a th:href="@{/carrito}" class="btn-cart" title="Carrito de compras" aria-label="Carrito de compras">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" th:text="${carritoCount != null ? carritoCount : 0}">0</span>
                </a>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Abrir menú de navegación móvil">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- Mobile Menu Adaptable Apple -->
    <div class="mobile-menu mobile-menu--publico" id="mobileMenu" aria-hidden="true">
        <div class="mobile-menu-header">
            <span>Menú</span>
            <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Cerrar menú">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Tarjeta de bienvenida a visitantes -->
        <div class="mobile-guest-card">
            <div class="mobile-guest-head">
                <div class="mobile-guest-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="mobile-guest-text">
                    <span class="mobile-guest-title">¡Bienvenido a Cultivus!</span>
                    <span class="mobile-guest-subtitle">Compra directo del campo o vende tus cosechas</span>
                </div>
            </div>
            <div class="mobile-guest-actions">
                <a th:href="@{/usuario/login}" class="mobile-guest-btn primary">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Iniciar sesión</span>
                </a>
                <a th:href="@{/usuario/registro}" class="mobile-guest-btn secondary">
                    <i class="fas fa-user-plus"></i>
                    <span>Registrarse</span>
                </a>
            </div>
        </div>

        <!-- Buscador integrado en móvil -->
        <div class="header-search header-search--mobile">
            <form th:action="@{/buscar}" method="get" role="search">
                <input type="search" name="q" placeholder="Buscar productos o fincas..."
                    autocomplete="off" aria-label="Buscar productos" class="header-search__input">
                <button type="submit" aria-label="Buscar" class="header-search__btn">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>

        <nav class="mobile-nav" aria-label="Navegación móvil pública">
            <!-- Accesos rápidos en cuadrícula 2x2 -->
            <div class="mobile-quick-grid">
                <a th:href="@{/}" class="mobile-quick-card">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a th:href="@{/category}" class="mobile-quick-card">
                    <i class="fas fa-th-large"></i>
                    <span>Categorías</span>
                </a>
                <a th:href="@{/ofertas}" class="mobile-quick-card">
                    <i class="fas fa-tag"></i>
                    <span>Ofertas</span>
                </a>
                <a th:href="@{/carrito}" class="mobile-quick-card">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Carrito</span>
                    <em class="mobile-quick-badge" th:if="${carritoCount != null and carritoCount > 0}" th:text="${carritoCount}">0</em>
                </a>
            </div>

            <span class="mobile-section-label">Explorar mercado</span>
            <a th:href="@{/productores#productores}"><i class="fas fa-seedling"></i> Productores</a>
            <a th:href="@{/nosotros#sobre-nosotros}"><i class="fas fa-info-circle"></i> Sobre nosotros</a>

            <div class="mobile-divider"></div>
            <span class="mobile-section-label">Únete a Cultivus</span>
            <a th:href="@{/vendedor/registro}" class="mobile-highlight">
                <i class="fas fa-store"></i> Vender en Cultivus
            </a>
            <a th:href="@{/transportista/registro}" class="mobile-highlight">
                <i class="fas fa-truck-fast"></i> Conviértete en transportista
            </a>
        </nav>

        <!-- Pie fijo con botón de iniciar sesión -->
        <div class="mobile-menu-footer">
            <a th:href="@{/usuario/login}" class="mobile-login-footer-btn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Iniciar sesión</span>
            </a>
        </div>
    </div>

    <script th:src="@{/js/header.js}"></script>
    <script>
        // Marcar enlace activo según la página actual
        (function () {
            try {
                const path = window.location.pathname;
                const hash = window.location.hash;
                const links = document.querySelectorAll('.header-nav .nav-link');
                let found = false;

                // 1. Intentar coincidencia con hash si existe
                if (hash) {
                    links.forEach(l => {
                        const href = l.getAttribute('href') || '';
                        if (href.endsWith(hash) || href === path + hash) {
                            links.forEach(x => x.classList.remove('active'));
                            l.classList.add('active');
                            found = true;
                        }
                    });
                }

                // 2. Si no hubo coincidencia con hash, buscar por path
                if (!found) {
                    links.forEach(l => {
                        const href = l.getAttribute('href') || '';
                        const hrefPath = href.split('#')[0].split('?')[0];
                        if (path === '/' && (hrefPath === '/' || hrefPath === '')) {
                            links.forEach(x => x.classList.remove('active'));
                            l.classList.add('active');
                            found = true;
                        } else if (path !== '/' && hrefPath !== '/' && hrefPath !== '' && (path === hrefPath || path.startsWith(hrefPath))) {
                            links.forEach(x => x.classList.remove('active'));
                            l.classList.add('active');
                            found = true;
                        }
                    });
                }

                // 3. Fallback: si nada coincidió y estamos en la raíz, activar Inicio
                if (!found && path === '/') {
                    const first = document.querySelector('.header-nav .nav-link');
                    if (first) first.classList.add('active');
                }
            } catch (err) {
                console.error(err);
            }
        })();
    </script>
</header>
