<header th:fragment="siteHeader" class="site-header">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <div class="header-premium" id="mainHeader">
        <div class="header-container">
            <!-- Logo con Slogan -->
            <div class="header-logo">
                <a th:href="@{/}">
                    <img th:src="@{/images/LogotipoCultivus.png}" alt="Cultivus">
                </a>
            </div>

            <!-- Navegación Principal (Público con Nosotros) -->
            <nav class="header-nav">
                <th:block th:replace="~{fragments/nav-publico :: enlacesPublico}"></th:block>
            </nav>

            <!-- Buscador Amplio Adaptable -->
            <div th:replace="~{fragments/nav-publico :: buscador}"></div>

            <!-- Acciones de Usuario (Iniciar sesión, Registrarse, Carrito) -->
            <div class="header-actions">
                <!-- Iniciar sesión -->
                <a th:href="@{/usuario/login}" class="btn-login">
                    <i class="fas fa-user"></i>
                    <span>Iniciar sesión</span>
                </a>

                <!-- Registrarse (Botón verde relleno) -->
                <a th:href="@{/usuario/registro}" class="btn-register">
                    <i class="fas fa-user-plus"></i>
                    <span>Registrarse</span>
                </a>

                <!-- Carrito con Badge -->
                <a th:href="@{/carrito}" class="btn-cart" title="Carrito de compras">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" th:text="${carritoCount != null ? carritoCount : 0}">0</span>
                </a>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-header">
            <span>Menú</span>
            <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Cerrar menú">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="mobile-nav">
            <th:block th:replace="~{fragments/nav-publico :: enlacesMovilPublico}"></th:block>
            <div class="mobile-divider"></div>
            <a th:href="@{/vendedor/registro}" class="mobile-highlight"><i class="fas fa-store"></i> Vender en
                Cultivus</a>
            <a th:href="@{/usuario/login}"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</a>
            <a th:href="@{/usuario/registro}"><i class="fas fa-user-plus"></i> Registrarse</a>
        </nav>
    </div>

    <script th:src="@{/js/header.js}"></script>
    <script>
        // Marcar enlace activo según la página actual
        (function () {
            try {
                const path = window.location.pathname;
                const hash = window.location.hash;
                const links = document.querySelectorAll('.header-nav .nav-link');
                let found = false;

                // 1. Intentar coincidencia con hash si existe
                if (hash) {
                    links.forEach(l => {
                        const href = l.getAttribute('href') || '';
                        if (href.endsWith(hash) || href === path + hash) {
                            links.forEach(x => x.classList.remove('active'));
                            l.classList.add('active');
                            found = true;
                        }
                    });
                }

                // 2. Si no hubo coincidencia con hash, buscar por path
                if (!found) {
                    links.forEach(l => {
                        const href = l.getAttribute('href') || '';
                        const hrefPath = href.split('#')[0].split('?')[0];
                        if (path === '/' && (hrefPath === '/' || hrefPath === '')) {
                            links.forEach(x => x.classList.remove('active'));
                            l.classList.add('active');
                            found = true;
                        } else if (path !== '/' && hrefPath !== '/' && hrefPath !== '' && (path === hrefPath || path.startsWith(hrefPath))) {
                            links.forEach(x => x.classList.remove('active'));
                            l.classList.add('active');
                            found = true;
                        }
                    });
                }

                // 3. Fallback: si nada coincidió y estamos en la raíz, activar Inicio
                if (!found && path === '/') {
                    const first = document.querySelector('.header-nav .nav-link');
                    if (first) first.classList.add('active');
                }
            } catch (err) {
                console.error(err);
            }
        })();
    </script>
</header>
