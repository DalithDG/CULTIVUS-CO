<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
    <meta charset="UTF-8">
</head>
<body>
    <header th:fragment="siteHeader" class="admin-header-premium">
        <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" th:href="@{/header-tokens.css}">
        <link rel="stylesheet" th:href="@{/header-admin.css}">

        <div class="header-container">
            <div class="header-logo">
                <a th:href="@{/admin/dashboard}" class="admin-logo-link">
                    <img th:src="@{/images/imagotipo_transparente.png}" alt="Cultivus">
                    <span class="admin-badge">Admin</span>
                </a>
            </div>

            <nav class="admin-nav" aria-label="Navegación del Administrador">
                <a th:href="@{/admin/dashboard}"
                   th:classappend="${currentPath != null and currentPath.contains('/dashboard')} ? ' active' : ''"
                   th:attr="aria-current=${currentPath != null and currentPath.contains('/dashboard')} ? 'page' : null">
                    <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
                </a>
                <a th:href="@{/admin/usuarios}"
                   th:classappend="${currentPath != null and currentPath.contains('/usuarios')} ? ' active' : ''"
                   th:attr="aria-current=${currentPath != null and currentPath.contains('/usuarios')} ? 'page' : null">
                    <i class="fa-solid fa-users"></i> <span>Usuarios</span>
                </a>
                <a th:href="@{/admin/productos}"
                   th:classappend="${currentPath != null and currentPath.contains('/productos')} ? ' active' : ''"
                   th:attr="aria-current=${currentPath != null and currentPath.contains('/productos')} ? 'page' : null">
                    <i class="fa-solid fa-box"></i> <span>Productos</span>
                </a>
                <a th:href="@{/admin/resenas}"
                   th:classappend="${currentPath != null and currentPath.contains('/resenas')} ? ' active' : ''"
                   th:attr="aria-current=${currentPath != null and currentPath.contains('/resenas')} ? 'page' : null">
                    <i class="fa-solid fa-star"></i> <span>Reseñas</span>
                </a>
            </nav>

            <div class="admin-user">
                <div class="user-info">
                    <div class="user-info__avatar">
                        <span th:if="${session.usuarioLogueado != null and session.usuarioLogueado.nombre != null and #strings.length(session.usuarioLogueado.nombre) > 0}"
                              th:text="${#strings.substring(session.usuarioLogueado.nombre, 0, 1).toUpperCase()}">A</span>
                        <i th:unless="${session.usuarioLogueado != null and session.usuarioLogueado.nombre != null and #strings.length(session.usuarioLogueado.nombre) > 0}"
                           class="fa-solid fa-circle-user"></i>
                    </div>
                    <span th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'Administrador'}">Admin</span>
                </div>
                <a th:href="@{/usuario/logout}" class="logout-btn" title="Cerrar sesión">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Salir</span>
                </a>
            </div>
        </div>
    </header>
</body>
</html>
