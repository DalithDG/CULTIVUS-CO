<header th:fragment="siteHeader" class="site-header">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <div class="header-premium" id="mainHeader">
        <div class="header-container">
            <!-- Logo -->
            <div class="header-logo">
                <a th:href="@{/vendedor/inicio}">
                    <img th:src="@{/images/imagotipoCultivus.png}" alt="Cultivus">
                </a>
            </div>

            <!-- Navegación Principal -->
            <nav class="header-nav">
                <a th:href="@{/vendedor/inicio}" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a th:href="@{/vendedor/productos/nuevo}" class="nav-link">
                    <i class="fas fa-plus-circle"></i>
                    <span>Agregar Producto</span>
                </a>
                <a th:href="@{/vendedor/mis-productos}" class="nav-link">
                    <i class="fas fa-box"></i>
                    <span>Mis Productos</span>
                </a>
                <a th:href="@{/vendedor/ventas}" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>Mis Ventas</span>
                </a>
                <a th:href="@{/vendedor/billetera}" class="nav-link">
                    <i class="fas fa-wallet"></i>
                    <span>Mi Billetera</span>
                </a>
                <a th:href="@{/usuario/pedidos}" class="nav-link">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Mis Compras</span>
                </a>

            </nav>

            <!-- Buscador -->
            <div th:replace="~{fragments/nav-publico :: buscador}"></div>

            <!-- CTAs -->
            <div class="header-actions">
                <!-- Notificaciones -->
                <a th:href="@{/usuario/notificaciones}" class="btn-notification">
                    <i class="fas fa-bell"></i>
                    <span class="badge-count" th:if="${notificacionesCount != null and notificacionesCount > 0}"
                        th:text="${notificacionesCount}">0</span>
                </a>

                <!-- Mi Perfil -->
                <a th:href="@{/usuario/perfil}" class="btn-profile-link">
                    <i class="fas fa-user-circle"></i>
                </a>

                <!-- Cerrar Sesión -->
                <a th:href="@{/usuario/logout}" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i>
                </a>

                <!-- Carrito -->
                <a th:href="@{/carrito}" class="btn-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge">0</span>
                </a>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-header">
            <span>Menú Vendedor</span>
            <button class="mobile-menu-close" id="mobileMenuClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="mobile-nav">
            <a th:href="@{/vendedor/inicio}"><i class="fas fa-home"></i> Inicio</a>
            <a th:href="@{/vendedor/productos/nuevo}"><i class="fas fa-plus-circle"></i> Agregar Producto</a>
            <a th:href="@{/vendedor/mis-productos}"><i class="fas fa-box"></i> Mis Productos</a>
            <a th:href="@{/vendedor/ventas}"><i class="fas fa-chart-line"></i> Mis Ventas</a>
            <a th:href="@{/vendedor/billetera}"><i class="fas fa-wallet"></i> Mi Billetera</a>
            <a th:href="@{/usuario/pedidos}"><i class="fas fa-shopping-bag"></i> Mis Compras</a>
            <div class="mobile-divider"></div>
            <a th:href="@{/usuario/inicio(modo='comprador')}" class="mobile-highlight"><i
                    class="fas fa-shopping-cart"></i> Modo Comprador</a>
            <a th:href="@{/usuario/notificaciones}"><i class="fas fa-bell"></i> Notificaciones</a>
            <a th:href="@{/usuario/perfil}"><i class="fas fa-user"></i> Mi Perfil</a>
            <a th:href="@{/usuario/logout}"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
        </nav>
    </div>

    <script th:src="@{/js/header.js}"></script>
</header>
