<header th:fragment="siteHeader">
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/accesibilidad-vendedor.css}">
    <link rel="stylesheet" th:href="@{/vendedor-sidebar.css}">

    <!-- ══════════════════ TOPBAR ══════════════════ -->
    <div class="vs-topbar" id="vsTopbar">
        <!-- Hamburger (mobile) -->
        <button class="vs-menu-toggle" id="vsMenuToggle" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>

        <!-- Logo -->
        <a th:href="@{/vendedor/dashboard}" class="vs-topbar__logo">
            <img th:src="@{/images/imagotipoCultivus.png}" alt="Cultivus">
        </a>

        <div class="vs-topbar__divider"></div>

        <!-- Breadcrumb / sección activa -->
        <div class="vs-topbar__breadcrumb">
            Panel de Vendedor <i class="fas fa-chevron-right"></i>
            <span id="vsBreadcrumbCurrent">Inicio</span>
        </div>

        <!-- Acciones derecha -->
        <div class="vs-topbar__actions">
            <!-- Accesibilidad -->
            <button type="button" class="vs-topbar__accessibility" id="btnTextoGrande" onclick="toggleTextoGrande()"
                aria-pressed="false" title="Cambiar tamaño de letra">
                <i class="fas fa-text-height"></i>
                <span>Letra grande</span>
            </button>

            <!-- Notificaciones -->
            <a th:href="@{/usuario/notificaciones}" class="vs-topbar__btn" title="Notificaciones">
                <i class="fas fa-bell"></i>
                <span class="vs-topbar__badge" th:if="${notificacionesCount != null and notificacionesCount > 0}"
                    th:text="${notificacionesCount}">0</span>
            </a>

            <!-- Cerrar sesión -->
            <a th:href="@{/usuario/logout}" class="vs-topbar__btn" title="Cerrar sesión">
                <i class="fas fa-sign-out-alt"></i>
            </a>

            <!-- Avatar / Perfil -->
            <a th:href="@{/vendedor/perfil}" class="vs-topbar__avatar" title="Mi perfil de vendedor">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </div>

    <!-- Overlay mobile -->
    <div class="vs-overlay" id="vsOverlay"></div>

    <!-- ══════════════════ SIDEBAR ══════════════════ -->
    <aside class="vs-sidebar" id="vsSidebar">
        <!-- Info del vendedor -->
        <div class="vs-sidebar__vendor">
            <div class="vs-sidebar__vendor-avatar">
                <i class="fas fa-store"></i>
            </div>
            <div class="vs-sidebar__vendor-info">
                <div class="vs-sidebar__vendor-name" th:text="${usuario != null ? usuario.nombre : 'Mi Tienda'}">Mi
                    Tienda</div>
                <div class="vs-sidebar__vendor-role">Vendedor · Cultivus</div>
            </div>
        </div>

        <!-- Grupo: Principal -->
        <nav class="vs-nav-group">
            <div class="vs-nav-group__label">Principal</div>

            <a th:href="@{/vendedor/dashboard}" class="vs-nav-item"
                th:classappend="${currentPath != null and currentPath.contains('/dashboard') ? ' is-active' : ''}">
                <span class="vs-nav-item__icon"><i class="fas fa-house"></i></span>
                Inicio
            </a>

            <a th:href="@{/vendedor/ventas}" class="vs-nav-item"
                th:classappend="${currentPath != null and currentPath.contains('/ventas') ? ' is-active' : ''}">
                <span class="vs-nav-item__icon"><i class="fas fa-receipt"></i></span>
                Ventas
                <span class="vs-nav-item__badge" th:if="${tareasPendientes != null and tareasPendientes > 0}"
                    th:text="${tareasPendientes}">0</span>
            </a>
        </nav>

        <div class="vs-sidebar__sep"></div>

        <!-- Grupo: Catálogo -->
        <nav class="vs-nav-group">
            <div class="vs-nav-group__label">Catálogo</div>

            <a th:href="@{/vendedor/mis-productos}" class="vs-nav-item"
                th:classappend="${currentPath != null and currentPath.contains('/mis-productos') ? ' is-active' : ''}">
                <span class="vs-nav-item__icon"><i class="fas fa-box"></i></span>
                Mis Productos
            </a>

            <a th:href="@{/vendedor/productos/nuevo}" class="vs-nav-item"
                th:classappend="${currentPath != null and currentPath.contains('/productos/nuevo') ? ' is-active' : ''}">
                <span class="vs-nav-item__icon"><i class="fas fa-plus-circle"></i></span>
                Agregar Producto
            </a>
        </nav>

        <div class="vs-sidebar__sep"></div>

        <!-- Grupo: Finanzas -->
        <nav class="vs-nav-group">
            <div class="vs-nav-group__label">Finanzas</div>

            <a th:href="@{/vendedor/billetera}" class="vs-nav-item"
                th:classappend="${currentPath != null and currentPath.contains('/billetera') ? ' is-active' : ''}">
                <span class="vs-nav-item__icon"><i class="fas fa-wallet"></i></span>
                Mi Billetera
            </a>
        </nav>

        <div class="vs-sidebar__sep"></div>

        <!-- Grupo: Cuenta -->
        <nav class="vs-nav-group">
            <div class="vs-nav-group__label">Configuración</div>

            <a th:href="@{/vendedor/perfil}" class="vs-nav-item"
                th:classappend="${currentPath != null and currentPath.contains('/vendedor/perfil') ? ' is-active' : ''}">
                <span class="vs-nav-item__icon"><i class="fas fa-id-card"></i></span>
                Mi Perfil
            </a>

            <a th:href="@{/vendedor/editar}" class="vs-nav-item"
                th:classappend="${currentPath != null and currentPath.contains('/vendedor/editar') ? ' is-active' : ''}">
                <span class="vs-nav-item__icon"><i class="fas fa-store"></i></span>
                Editar mi Tienda
            </a>
        </nav>

        <!-- Bottom: cerrar sesión -->
        <div class="vs-sidebar__bottom">
            <a th:href="@{/usuario/logout}" class="vs-nav-item vs-nav-item--logout">
                <span class="vs-nav-item__icon"><i class="fas fa-arrow-right-from-bracket"></i></span>
                Cerrar Sesión
            </a>
        </div>
    </aside>

    <!-- Scripts -->
    <script>
        // ── Auto active navigation & breadcrumb ────────────
        (function () {
            var path = window.location.pathname;
            var navItems = document.querySelectorAll('.vs-sidebar .vs-nav-item');
            navItems.forEach(function (item) {
                var href = item.getAttribute('href');
                if (!href) return;
                if (href === '/vendedor/dashboard' && (path === '/vendedor/dashboard' || path === '/vendedor' || path === '/vendedor/')) {
                    item.classList.add('is-active');
                } else if (href !== '/vendedor/dashboard' && href !== '/usuario/logout' && path.startsWith(href)) {
                    item.classList.add('is-active');
                }
            });

            var bc = document.getElementById('vsBreadcrumbCurrent');
            if (bc) {
                if (path.includes('/dashboard')) bc.textContent = 'Panel Principal';
                else if (path.includes('/ventas/pedido')) bc.textContent = 'Detalle de Venta';
                else if (path.includes('/ventas')) bc.textContent = 'Gestión de Ventas';
                else if (path.includes('/mis-productos')) bc.textContent = 'Mi Catálogo';
                else if (path.includes('/productos/nuevo')) bc.textContent = 'Publicar Producto';
                else if (path.includes('/productos/editar')) bc.textContent = 'Editar Oferta';
                else if (path.includes('/billetera')) bc.textContent = 'Mi Billetera';
                else if (path.includes('/editar')) bc.textContent = 'Perfil de Tienda';
                else if (path.includes('/perfil')) bc.textContent = 'Mi Cuenta';
            }
        })();

        // ── Sidebar mobile toggle ──────────────────────────
        (function () {
            var toggle = document.getElementById('vsMenuToggle');
            var sidebar = document.getElementById('vsSidebar');
            var overlay = document.getElementById('vsOverlay');

            function openSidebar() {
                if (sidebar) sidebar.classList.add('is-open');
                if (overlay) overlay.classList.add('is-visible');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                if (sidebar) sidebar.classList.remove('is-open');
                if (overlay) overlay.classList.remove('is-visible');
                document.body.style.overflow = '';
            }

            if (toggle) toggle.addEventListener('click', openSidebar);
            if (overlay) overlay.addEventListener('click', closeSidebar);
        })();

        // ── Accesibilidad: texto grande ────────────────────
        (function () {
            var CLAVE = 'cultivus-texto-grande';

            function aplicarTextoGrande(activo) {
                document.documentElement.classList.toggle('texto-grande', activo);
                var boton = document.getElementById('btnTextoGrande');
                if (boton) {
                    boton.setAttribute('aria-pressed', String(activo));
                    var etiqueta = boton.querySelector('span');
                    if (etiqueta) etiqueta.textContent = activo ? 'Letra normal' : 'Letra grande';
                }
            }

            window.toggleTextoGrande = function () {
                var activo = !document.documentElement.classList.contains('texto-grande');
                localStorage.setItem(CLAVE, activo ? '1' : '0');
                aplicarTextoGrande(activo);
            };

            aplicarTextoGrande(localStorage.getItem(CLAVE) === '1');
        })();
    </script>
</header>
