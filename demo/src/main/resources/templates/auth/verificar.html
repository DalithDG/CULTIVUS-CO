<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Verifica tu cuenta en Cultivus e ingresa a comprar o vender productos frescos">
    <title>Verificar Cuenta - Cultivus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/header-tokens.css}">
    <link rel="stylesheet" th:href="@{/checkout-tokens.css}">
    <link rel="stylesheet" th:href="@{/cultivus-ui.css}">
    <link rel="stylesheet" th:href="@{/auth-apple.css}">
</head>

<body class="auth-page">

    <div class="auth-card">

        <!-- Cabecera -->
        <div class="auth-header">
            <a th:href="@{/}" class="auth-logo-box" aria-label="Ir al inicio de Cultivus">
                <img th:src="@{/images/imagotipo_transparente.png}" alt="Cultivus" class="auth-logo">
            </a>

            <div class="auth-verify-icon">
                <i class="fas fa-shield-halved" aria-hidden="true"></i>
            </div>

            <h1 class="auth-title">Verifica tu cuenta</h1>
            <p class="auth-subtitle">Ingresa el código numérico de 6 dígitos que te enviamos para activar tu cuenta.</p>

            <!-- Chip informativo del correo destinatario -->
            <div class="auth-verify-email-chip" th:if="${email != null and #strings.length(email) > 0}">
                <i class="fas fa-envelope-circle-check" aria-hidden="true"></i>
                <span>Enviado a: <strong th:text="${email}">usuario@correo.com</strong></span>
            </div>
        </div>

        <!-- Alertas de estado -->
        <div th:if="${mensaje != null or param.mensaje != null}" class="auth-alert auth-alert--success" role="status">
            <i class="fas fa-circle-check" aria-hidden="true"></i>
            <span th:text="${mensaje != null ? mensaje : param.mensaje[0]}"></span>
        </div>

        <div th:if="${error}" class="auth-alert auth-alert--error" role="alert">
            <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
            <span th:text="${error}"></span>
        </div>

        <div th:if="${param.error}" class="auth-alert auth-alert--error" role="alert">
            <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
            <span th:text="${param.error[0]}"></span>
        </div>

        <!-- Formulario de Verificación -->
        <form class="auth-form" th:action="@{/usuario/verificar}" method="post" id="verifyForm">
            <input type="hidden" name="email" th:value="${email}" />

            <div class="auth-field">
                <label class="auth-label" for="codigo">
                    Código de verificación
                    <span class="req">*</span>
                </label>
                <div class="auth-input-wrap">
                    <input type="text"
                           id="codigo"
                           name="codigo"
                           class="auth-input auth-code-input"
                           placeholder="······"
                           maxlength="6"
                           pattern="[0-9]{6}"
                           required
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           autofocus>
                </div>
                <div class="ui-form-hint" style="text-align: center; margin-top: 6px;">
                    El código consta de 6 dígitos numéricos.
                </div>
                <div id="countdown" style="text-align:center;margin-top:8px;font-weight:600;color:#b00;"></div>
            </div>

            <button type="submit" class="auth-btn-submit" id="btnVerificar">
                <i class="fas fa-circle-check" aria-hidden="true"></i>
                <span>Verificar y continuar</span>
            </button>
        </form>

        <!-- Reenviar código -->
        <div class="auth-resend-box">
            <p style="margin: 0 0 6px;">¿No recibiste el correo? Revisa también tu carpeta de spam o promociones.</p>
            <form th:action="@{/usuario/verificar/reenviar}" method="post" class="auth-resend-form">
                <input type="hidden" name="email" th:value="${email}" />
                <button type="submit" class="auth-resend-btn" id="btnReenviar">
                    <i class="fas fa-rotate-right" aria-hidden="true"></i>
                    <span>Reenviar código</span>
                </button>
            </form>
        </div>

        <!-- Enlaces al pie -->
        <p class="auth-footer-prompt">
            <a th:href="@{/usuario/login}" class="auth-footer-link">
                Volver a iniciar sesión
            </a>
        </p>

    </div>

    <!-- Script de autocompletado y validación de 6 dígitos -->
    <script th:inline="javascript">
        (function () {
            const codigoInput = document.getElementById('codigo');
            if (codigoInput) {
                // Permitir únicamente números
                codigoInput.addEventListener('input', function (e) {
                    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
                });
            }

            // Temporizador basado en tiempo real del servidor
            const countdown = document.getElementById('countdown');
            const expiraEpoch = /*[[${expiraEpoch}]]*/ null;
            if (countdown) {
                let remaining = expiraEpoch ? Math.max(0, Math.floor((expiraEpoch - Date.now()) / 1000)) : 15 * 60;
                function tick() {
                    const m = Math.floor(remaining / 60);
                    const s = remaining % 60;
                    countdown.textContent = 'Tiempo restante: ' + m + ':' + (s < 10 ? '0' : '') + s;
                    if (remaining <= 0) {
                        countdown.textContent = 'El código ha expirado. Reenvía uno nuevo.';
                        clearInterval(timer);
                        return;
                    }
                    remaining--;
                }
                tick();
                const timer = setInterval(tick, 1000);
            }
        })();
    </script>

</body>

</html>
