<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Recupera el acceso a tu cuenta de Cultivus de forma segura">
    <meta name="robots" content="noindex, nofollow">
    <title>Recuperar contraseña - Cultivus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/header-tokens.css}">
    <link rel="stylesheet" th:href="@{/checkout-tokens.css}">
    <link rel="stylesheet" th:href="@{/cultivus-ui.css}">
    <link rel="stylesheet" th:href="@{/auth-apple.css}">
</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <a th:href="@{/}" class="auth-logo-box" aria-label="Ir al inicio de Cultivus">
                <img th:src="@{/images/imagotipo_transparente.png}" alt="Cultivus" class="auth-logo">
            </a>
            <h1 class="auth-title">Recuperar contraseña</h1>
            <p class="auth-subtitle">Te enviaremos un enlace seguro para crear una nueva</p>
        </div>

        <!-- Mensaje genérico de respuesta -->
        <div th:if="${mensaje}" class="auth-alert auth-alert--success" role="status">
            <i class="fas fa-check-circle" aria-hidden="true"></i>
            <span th:text="${mensaje}"></span>
        </div>

        <div th:if="${error}" class="auth-alert auth-alert--error" role="alert">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
            <span th:text="${error}"></span>
        </div>

        <form class="auth-form" th:action="@{/usuario/recuperar}" method="post" id="recoveryForm">
            <div class="auth-field">
                <label class="auth-label" for="email">Correo electrónico</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-envelope field-icon" aria-hidden="true"></i>
                    <input type="email" id="email" name="email" class="auth-input"
                           placeholder="tu@correo.com" th:value="${email}" required maxlength="254"
                           autocomplete="email" inputmode="email" autofocus>
                </div>
                <div class="ui-form-hint">
                    Usa el mismo correo con el que te registraste en Cultivus.
                </div>
            </div>

            <button type="submit" class="auth-btn-submit" id="submitBtn">
                Enviar enlace de recuperación
            </button>
        </form>

        <p class="auth-footer-prompt">
            <a th:href="@{/usuario/login}" class="auth-footer-link">
                Volver a iniciar sesión
            </a>
        </p>

        <a th:href="@{/}" class="auth-back-home">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            <span>Volver a la página principal</span>
        </a>

    </div>

</body>

</html>
