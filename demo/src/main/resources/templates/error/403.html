<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/isotipo_transparente.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso restringido (403) - Cultivus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" th:href="@{/header-tokens.css}">
    <link rel="stylesheet" th:href="@{/checkout-tokens.css}">
    <link rel="stylesheet" th:href="@{/cultivus-ui.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">

    <style>
        .error-page-wrap {
            min-height: calc(100dvh - 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
        }

        .error-card {
            background: var(--c-surface, #ffffff);
            border: 1px solid var(--c-line, rgba(48, 55, 45, 0.12));
            border-radius: 24px;
            padding: 44px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(138, 45, 37, 0.1);
            color: var(--c-danger, #8A2D25);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .error-icon-box {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(138, 45, 37, 0.08);
            color: var(--c-danger, #8A2D25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: clamp(1.4rem, 3.5vw, 1.85rem);
            font-weight: 800;
            color: var(--c-ink, #30372D);
            line-height: 1.2;
            margin: 0 0 12px;
        }

        .error-desc {
            font-size: 0.95rem;
            color: var(--c-earth, #795548);
            line-height: 1.6;
            margin: 0 0 28px;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 32px 20px;
            }
            .error-actions {
                flex-direction: column;
            }
            .error-actions .ui-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body class="error-page">

    <th:block th:replace="~{fragments/header :: siteHeader}"></th:block>

    <main class="ui-container error-page-wrap">
        <div class="error-card">
            <span class="error-badge">
                <i class="fas fa-lock" aria-hidden="true"></i> Código 403
            </span>
            <div>
                <div class="error-icon-box" aria-hidden="true">
                    <i class="fas fa-shield-halved"></i>
                </div>
            </div>
            <h1 class="error-title">Acceso restringido</h1>
            <p class="error-desc">
                No tienes los permisos requeridos para ingresar a este panel o recurso. Inicia sesión con la cuenta adecuada o regresa al inicio.
            </p>
            <div class="error-actions">
                <a th:href="@{/}" class="ui-btn ui-btn--primary">
                    <i class="fas fa-home" aria-hidden="true"></i> Volver al Inicio
                </a>
                <a th:href="@{/usuario/login}" class="ui-btn ui-btn--secondary">
                    <i class="fas fa-arrow-right-to-bracket" aria-hidden="true"></i> Iniciar Sesión
                </a>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: siteFooter}"></th:block>

</body>

</html>
