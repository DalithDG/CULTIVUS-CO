# =======================================================
# LIMPIEZA / PURGA DE DATOS MASIVOS
# En true purga todos los datos falsos inyectados al arrancar.
# Cámbialo a false una vez haya limpiado la base de datos.
# =======================================================
cultivus.purge-data.enabled=false
