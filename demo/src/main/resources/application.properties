# ── Configuración de envío provisional ─────────────────────────────
cultivus.envio.provisional=${CULTIVUS_ENVIO_PROVISIONAL:10000.0}
# Wompi API (consulta de transacciones). Sandbox por defecto; en produccion: https://production.wompi.co/v1
