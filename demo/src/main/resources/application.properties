# =======================================================
# SERVIDOR & PUERTO
# =======================================================
# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.application.name=cultivus

# =======================================================
# PERFIL ACTIVO (dev por defecto; en Render define SPRING_PROFILES_ACTIVE=prod)
# =======================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =======================================================
# MONGODB ATLAS
# En Render, define la variable de entorno SPRING_DATA_MONGODB_URI con:
# mongodb+srv://USUARIO:CLAVE@cluster.xxxxx.mongodb.net/cultivus?retryWrites=true&w=majority
#
# Para desarrollo local, crea un archivo .env o define la variable en tu sistema.
# El valor de localhost solo funciona si tienes MongoDB instalado localmente.
# =======================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cultivus}
spring.data.mongodb.database=cultivus

# =======================================================
# THYMELEAF & ASSETS
# Cache desactivada en dev, activada en prod (Render)
# =======================================================
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.web.resources.cache.period=${STATIC_CACHE_SECONDS:0}

# =======================================================
# GOOGLE OAUTH2 (OPCIONAL)
# Si estas variables NO están definidas, OAuth2 se desactiva automáticamente
# y la app funciona normal con login por formulario.
#
# Para activar OAuth2:
# 1. Crea credenciales en https://console.cloud.google.com
# 2. Agrega estas variables en Render > Environment:
#    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=tu-client-id
#    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=tu-client-secret
# 3. Redirect URI en Google Cloud Console:
#    https://cultivus-co.onrender.com/login/oauth2/code/google
# =======================================================
#spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
#spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.google.scope=openid,profile,email

# =======================================================
# FACEBOOK OAUTH2 (OPCIONAL)
# Si estas variables NO están definidas, OAuth2 con Facebook se desactiva
# automáticamente y la app funciona normal con login por formulario.
#
# Para activar Facebook Login:
# 1. Crea una app en https://developers.facebook.com/apps
# 2. Agrega el producto "Facebook Login" (tipo: Web)
# 3. En "Facebook Login > Settings", agrega la Redirect URI válida:
#    https://cultivus-co.onrender.com/login/oauth2/code/facebook
#    (y para desarrollo local: http://localhost:8080/login/oauth2/code/facebook)
# 4. Agrega estas variables en Render > Environment:
#    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID=tu-app-id
#    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET=tu-app-secret
#
# NOTA: Spring Security 6.3.x trae por defecto endpoints de Facebook v2.8
# (API ya descontinuada), por eso los sobreescribimos con una versión vigente.
# =======================================================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.facebook.scope=${FACEBOOK_SCOPE:email,public_profile,user_location}
spring.security.oauth2.client.registration.facebook.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v23.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v23.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v23.0/me?fields=id,name,email
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# =======================================================
# LOGGING
# =======================================================
logging.level.root=INFO
logging.level.com.example.demo=${LOG_LEVEL_APP:INFO}

# =======================================================
# ERRORES (sin stacktrace hacia el cliente)
# =======================================================
server.error.include-message=always
server.error.include-stacktrace=never

