# =======================================================
# SERVIDOR & PUERTO
# =======================================================
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.application.name=cultivus

# =======================================================
# MONGODB ATLAS (DESARROLLO - URI simplificado para testing)
# =======================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cultivus}
spring.data.mongodb.database=cultivus

# =======================================================
# THYMELEAF & ASSETS
# =======================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# =======================================================
# LOGGING
# =======================================================
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# =======================================================
# GOOGLE OAUTH2 (DESHABILITADO EN DESARROLLO)
# =======================================================
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:dev-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# =======================================================
# ERRORES
# =======================================================
server.error.include-message=always
server.error.include-stacktrace=always
