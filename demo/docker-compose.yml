version: '3.8'

services:
  cultivus-app:
    image: cultivusco:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cultivus-dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/cultivus
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: dev-client-id
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: dev-secret
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - cultivus-network

  mongodb:
    image: mongo:7.0-alpine
    container_name: cultivus-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: cultivus
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cultivus-network

volumes:
  mongodb_data:
  mongodb_config:

networks:
  cultivus-network:
    driver: bridge
