services:
  - type: web
    name: cultivus-app
    runtime: docker
    region: ohio
    plan: starter
    # rootDir indica la carpeta dentro del repositorio donde está el Dockerfile
    rootDir: demo
    # autoDeploy: true hace que Render despliegue automáticamente al hacer push
    autoDeploy: true
    healthCheckPath: /
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      # URL pública de la app (sin barra final). Ej: https://cultivus-co.onrender.com
      - key: APP_BASE_URL
        sync: false
      - key: MAIL_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbwj7liB3oi7bq0Dgwr_ytQ41mgEPe4Rd2_HTpF5lMiTlD9Y8ORT0-A5O9XPYWbeE7NJ2A/exec
      # SMTP Gmail. MAIL_PASSWORD es una contraseña de aplicación, nunca la del correo.
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_AUTH
        value: true
      - key: MAIL_STARTTLS
        value: true
      #- key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
      #  sync: false
      #- key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
      #  sync: false
